name: Validate Persian Font Switcher

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install font validation dependency
        run: python3 -m pip install 'fonttools>=4.46,<5'
      - name: Build deterministic module ZIP
        run: ./scripts/build.sh
      - name: Validate project, scripts, fonts, WebUI, and ZIP
        run: ./scripts/validate.sh ./Persian-Font-Switcher-v0.1.0-rc2.zip
      - name: Write checksum
        run: sha256sum Persian-Font-Switcher-v0.1.0-rc2.zip > Persian-Font-Switcher-v0.1.0-rc2.zip.sha256
      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: Persian-Font-Switcher-v0.1.0-rc2
          path: |
            Persian-Font-Switcher-v0.1.0-rc2.zip
            Persian-Font-Switcher-v0.1.0-rc2.zip.sha256
          if-no-files-found: error
